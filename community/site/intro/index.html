<script type="module">
/* =====================================================================
   Lor Pisang · Pasar Malam — zoom-in intro diorama (Three.js r170)

   Look: anime background art. Colours stay soft and airy; every edge gets
   a thin warm-dark line from a screen-space pass over depth, normals and
   material ids. Shops follow real HDB neighbourhood-centre shops: narrow
   frontage, deep interiors packed at every height, goods spilling across
   the five-foot way and the canopy zone (the ODA) up to the yellow lines.

   Built left → right in stages. Each street section has its own build
   function and reads every position from LAYOUT below.
     Stage 1  framework · left street corner · fruit shop        (done)
     Stage 2  barber · provision shop                           (done)
     Stage 3  convenience store · bubble tea + clothes stall    (done)
     Stage 4  before/after seam · pasar malam tent structure   (done)
     Stage 5  six night-market stalls                           (done)
     Stage 6  hardware · kueh · medical hall spilling into the tent   (done)
     Stage 7  right street corner · back lane · hawker centre   (done)
     Stage 8  animals, life traces, motion and performance polish   (done)

   The covered linkway over the back lane is the page's door: hovering
   makes it catch the light, and a click flies the camera through it into
   the next page (section 15).

   Shop names are fictional. Hidden URL parameter for development:
   ?x=<metres> starts the camera at that point along the street.
   ===================================================================== */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------------------------------------------------------------
   1. LAYOUT — x runs along the street (left → right), z points toward
   the viewer, y is up. Units are metres.
   --------------------------------------------------------------------- */
const GAP = 0.015;                       // half-width of the module seam
const L = {
  length: 74,
  seam: 45,                              // weekday | pasar malam modules
  modules: [[0, 45], [45, 74]],
  building: [15, 62],                    // block extent
  z: {
    front: 6.8,      // front cut of the base
    lane: 3.45,      // outer line of the parking lane
    kerbOut: 1.25,   // road face of the kerb
    kerb: 1.05,      // kerb back = drain front wall
    drain: 0.2,      // drain back wall = canopy-zone front edge
    oda: 0.08,       // yellow ODA outer boundary line
    col: -2.4,       // column centre line
    beam: -2.12,     // arcade beam face (signboards mount here)
    wall: -2.3,      // upper-floor facade plane
    shop: -5.0,      // shopfront line (five-foot way is col → shop)
    back: -11.0,     // shop back wall (inner face)
    rear: -11.6,     // building rear
    edge: -12.0,     // back edge of the base
  },
  y: { walk: 0.15, beamBot: 4.4, ceil: 5.0, slab: 5.25, floorH: 2.85, floors: 3, base: -1.75 },
  // pasar malam tent over the closed road: posts at zb (by the kerb) and zf (front), ridge midway
  // it starts 3.6 m past the seam so the hardware shop's overflow past its yellow line stays in view
  tent: { x0: 48.6, x1: 61.75, bays: 4, zb: 1.55, zf: 6.4, eave: 4.3, ridge: 5.97 },
  // right corner: the road turns into a back lane (kerb faces x0, x1) beside the hawker centre, whose
  // floor starts at x0 and runs back from `front`; its eave and the face of its stall row
  lane: { x0: 63.4, x1: 67.2 },
  hawker: { x0: 67.85, front: 1.0, floor: 0.27, eaveZ: 1.45, eaveY: 6.55, stallFront: -4.95, stallBack: -6.85 },
};

const SECTIONS = [
  { id: 'cornerL',   x0: 0,    x1: 15,   build: buildCornerLeft },
  { id: 'fruit',     x0: 15,   x1: 22,   shop: true, unit: '#01-21', wall: 'mint',  build: buildFruitShop, light: [0xffdcae, 0.9] },
  { id: 'barber',    x0: 22,   x1: 27,   shop: true, unit: '#01-23', wall: 'cream', build: buildBarber,    light: [0xe2eeff, 0.95] },
  { id: 'provision', x0: 27,   x1: 33,   shop: true, unit: '#01-25', wall: 'coral', build: buildProvision, light: [0xffd08c, 1.15] },
  { id: 'mart',      x0: 33,   x1: 39.5, shop: true, unit: '#01-27', wall: 'mint',  build: buildMart,      light: [0xeef6ff, 1.3] },
  { id: 'boba',      x0: 39.5, x1: 45,   shop: true, unit: '#01-29', wall: 'cream', build: buildBoba,      light: [0xffd8e2, 1.0] },
  { id: 'hardware',  x0: 45,   x1: 51.5, shop: true, unit: '#01-31', wall: 'coral', build: buildHardware,  light: [0xf0f4ff, 1.1] },
  { id: 'kueh',      x0: 51.5, x1: 56.5, shop: true, unit: '#01-33', wall: 'mint',  build: buildKueh,      light: [0xffe2bc, 1.0] },
  { id: 'medical',   x0: 56.5, x1: 62,   shop: true, unit: '#01-35', wall: 'cream', build: buildMedical,   light: [0xffd59a, 0.85] },
  { id: 'cornerR',   x0: 62,   x1: 74,   build: buildCornerRight },
];

const CAM = { fov: 22, pitch: 20, ty: 2.0, tz: -2.0, viewH: 14.0, minViewW: 17, endPad: 1.6 };
const NEXT_PAGE = '../navigation/index.html';   // where the gate leads: the 3D walk through Campbell Lane, which opens on the same cream
const SUN_DIR = new THREE.Vector3(-0.45, 0.85, 0.30).normalize();   // toward the sun (≈3:30 pm)

// Soft, slightly desaturated palette in the spirit of anime background art.
const PAL = {
  ink: 0x3a322d, haze: 0xe8edef,
  wall: { mint: 0xcde3d6, cream: 0xf2e8cc, coral: 0xefd0c3 },
  trim: 0xf7f4ee, column: 0xeee8dd, room: 0x6d7880,
  steel: 0xb9c1c7, darkSteel: 0x6f777e, darkWood: 0x8e6a49,
  // plant palettes run from shaded to lit
  crown: [0x3b6644, 0x527d4d, 0x6c9958, 0x8db766, 0xb0cc7a],
  shrub: [0x305a3f, 0x436e47, 0x598751, 0x76a15d, 0x98bb6c],
  deep: [0x2d573c, 0x3d6a46, 0x528251, 0x6b9a5d],
  snake: [0x46704a, 0x5a8452, 0x6e985b],
  pothos: [0x4c8546, 0x67a057, 0x88b968, 0xadd17d],
  grass: [0x6f9a55, 0x87ad62, 0x9bbd6c],
  succulent: [0x6f9a92, 0x86ad9f, 0x9fc0ad, 0xbcd4bf],
  herb: [0x46803f, 0x5e9a4c, 0x79b25c, 0x96c56e],
  spider: [0x86b860, 0xa8cc7a, 0xd2e6a8, 0xeef4d8],
  bract: [0xb0306a, 0xca4580, 0xdd6197, 0xec84b0],
  ixora: [0xc23a2e, 0xda5034, 0xec6c44, 0xf69a66],
  geranium: [0xbf3539, 0xd74a47, 0xe8695c, 0xf38d7c],
  marigold: [0xd9842a, 0xeb9f36, 0xf5bd55],
  flameLeaf: [0x3a6845, 0x4e7f4c, 0x659956, 0x80af60, 0xa3c672],
  flame: [0xd99a1c, 0xe8b42e, 0xf3cc45, 0xfae27a],
  hydrangea: [[0x6872c0, 0x8792d8, 0xa5afe9, 0xc5ccf5], [0xc4689a, 0xda86b0, 0xe9a6c6, 0xf4c6dc], [0x8b6cc2, 0xa689d6, 0xc0a7e7, 0xd9c7f3]],
};
const CRATE_COLS = [0x4f86c6, 0xd9564a, 0x5aa36a, 0x4f86c6, 0xe3b33f];

/* ---------------------------------------------------------------------
   2. Small utilities
   --------------------------------------------------------------------- */
const PI = Math.PI, TAU = PI * 2;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const { clamp, lerp, smoothstep, degToRad } = THREE.MathUtils;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, a) => a[Math.floor(r() * a.length)];
const span = (r, a, b) => a + (b - a) * r();
const _up = V3(0, 1, 0);

/* ---------------------------------------------------------------------
   3. Renderer, scene, camera, light
   --------------------------------------------------------------------- */
let PR = Math.min(window.devicePixelRatio || 1, 2);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = skyTexture();

const camera = new THREE.PerspectiveCamera(CAM.fov, innerWidth / innerHeight, 5, 700);
let camDist = 50, camTy = CAM.ty;
function frameCamera() {
  camera.aspect = innerWidth / innerHeight;
  // portrait screens show a narrower slice so the model stays large; swiping covers the rest
  const minW = camera.aspect < 1 ? 11 : CAM.minViewW;
  const viewH = Math.max(CAM.viewH, minW / camera.aspect);
  camDist = (viewH / 2) / Math.tan(degToRad(CAM.fov / 2));
  // a taller view keeps the plinth at the bottom edge and spends the extra height on the block above
  camTy = CAM.ty + 0.46 * (viewH - CAM.viewH) / Math.cos(degToRad(CAM.pitch));
  camera.updateProjectionMatrix();
}
const viewWidth = () => 2 * camDist * Math.tan(degToRad(CAM.fov / 2)) * camera.aspect;
function placeCamera(x) {
  const p = degToRad(CAM.pitch);
  camera.position.set(x, camTy + camDist * Math.sin(p), CAM.tz + camDist * Math.cos(p));
  camera.lookAt(x, camTy, CAM.tz);
}

const SUN_K = 2.6;
const sun = new THREE.DirectionalLight(0xfff1df, SUN_K);
sun.castShadow = true;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.022;
sun.shadow.radius = 2.5;
sun.shadow.intensity = 0.78;            // shadows stay airy and lavender
sun.shadow.autoUpdate = false;          // re-rendered only when the frustum re-centres
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xc4caf0, 0xf1e5d5, 1.62);   // lavender sky fill, warm bounce
scene.add(hemi);

/* ---------------------------------------------------------------------
   4. Post-processing: scene → line art (depth/normal/material ids) →
   overlay sprites → gentle bloom → tone mapping.
   --------------------------------------------------------------------- */
const sceneRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: PR >= 1.5 ? 2 : 4 });
const nrmRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
nrmRT.depthTexture = new THREE.DepthTexture(1, 1, THREE.FloatType);

// Leaves flutter in the breeze: each one bends about its stalk (the tip moves most) with its own phase,
// on top of a slow gust that rolls along the street. The normal/id pass bends them the same way.
const WIND_GLSL = `
vec3 windOffset( vec3 p, vec4 inst ) {
  float ph = dot( inst.xyz, vec3( 1.7, 0.9, 2.3 ) );
  float tip = clamp( p.y, 0.0, 1.2 );
  float f = 0.5 * sin( uTime * 2.1 + ph ) + 0.25 * sin( uTime * 3.5 + ph * 1.9 ) + 0.35 * sin( uTime * 0.8 - inst.x * 0.35 );
  return vec3( 0.025 * f * tip, 0.0, 0.085 * f * tip * tip );
}`;
const NRM_VS = `
varying vec3 vN;
varying vec2 vUv0;
#ifdef USE_INKID
attribute float inkId;
varying float vInkId;
#endif
#ifdef USE_WIND
uniform float uTime;
${WIND_GLSL}
#endif
void main() {
  vUv0 = uv;
#ifdef USE_INKID
  vInkId = inkId;
#endif
  vec3 objectNormal = normal;
  vec4 p = vec4( position, 1.0 );
#ifdef USE_INSTANCING
#ifdef USE_WIND
  p.xyz += windOffset( position, instanceMatrix[ 3 ] );
#endif
  mat3 im = mat3( instanceMatrix );
  objectNormal /= vec3( dot( im[ 0 ], im[ 0 ] ), dot( im[ 1 ], im[ 1 ] ), dot( im[ 2 ], im[ 2 ] ) );
  objectNormal = im * objectNormal;
  p = instanceMatrix * p;
#endif
  vN = normalize( normalMatrix * objectNormal );
  gl_Position = projectionMatrix * modelViewMatrix * p;
}`;
const NRM_FS = `
uniform float uId;
uniform sampler2D uMap;
uniform float uCut;
varying vec3 vN;
varying vec2 vUv0;
#ifdef USE_INKID
varying float vInkId;
#endif
void main() {
#ifdef USE_CUT
  if ( texture2D( uMap, vUv0 ).a < uCut ) discard;
#endif
  vec3 n = normalize( vN );
  if ( ! gl_FrontFacing ) n = -n;
#ifdef USE_INKID
  float id = vInkId;
#else
  float id = uId;
#endif
#ifdef USE_LIT
  id = - max( id, 0.001 );     // the lit gate: a negative id marks its pixels for the highlight in the ink pass
#endif
  gl_FragColor = vec4( n * 0.5 + 0.5, id );
}`;
const INK_FS = `
uniform sampler2D tColor;
uniform sampler2D tNrm;
uniform sampler2D tDepth;
uniform vec2 uTexel;
uniform float uNear;
uniform float uFar;
uniform float uPx;
uniform vec3 uInk;
uniform vec3 uHaze;
uniform mat4 uProjInv;
uniform mat4 uCamWorld;
uniform float uTime;
// the gate (section 15): how lit it is, its screen rect in uv, the view depth just in front of it (anything nearer
// occludes it), where the light sweep is (below -0.5: none), the rim width in pixels, and the rim and line colours
uniform float uGate;
uniform vec4 uGateBox;
uniform float uGateNear;
uniform float uSweep;
uniform float uRimPx;
uniform vec3 uGateRim;
uniform vec3 uGateLine;
varying vec2 vUv;
#include <packing>
// heat shimmer: only over the sunny asphalt of the two side roads, growing into the distance
float heatHaze( vec3 w ) {
  if ( w.y > 0.45 || w.y < -0.05 ) return 0.0;
  float sides = step( w.z, ${(L.z.kerbOut + 0.05).toFixed(2)} ) * ( step( 1.1, w.x ) * step( w.x, 6.1 ) + step( ${(L.lane.x0 - 0.1).toFixed(2)}, w.x ) * step( w.x, ${(L.lane.x1 + 0.1).toFixed(2)} ) );
  return sides * ( 0.3 + 0.7 * smoothstep( 2.0, -11.0, w.z ) ) * ( 1.0 - smoothstep( 0.12, 0.45, w.y ) );
}
const vec2 OFF[ 8 ] = vec2[ 8 ]( vec2( 1, 0 ), vec2( 0, 1 ), vec2( 1, 1 ), vec2( -1, 1 ), vec2( -1, 0 ), vec2( 0, -1 ), vec2( -1, -1 ), vec2( 1, -1 ) );
float lin( float d ) { return - perspectiveDepthToViewZ( d, uNear, uFar ); }
void main() {
  float rd = texture2D( tDepth, vUv ).x;
  vec4 a = texture2D( tNrm, vUv );
  float aa = abs( a.a ), gate = step( a.a, -0.0001 );   // the lit gate writes its ids negated
  float da = lin( rd );
  vec3 w = vec3( 0.0, 99.0, 0.0 );
  if ( rd < 1.0 ) {
    vec4 v = uProjInv * vec4( vUv * 2.0 - 1.0, rd * 2.0 - 1.0, 1.0 );
    v /= v.w;
    w = ( uCamWorld * v ).xyz;
  }
  // heat shimmer moves only the colour lookup, sideways and row by row: the line art stays put, so edges
  // running across the screen never crawl
  vec2 uvC = vUv;
  float hz = heatHaze( w );
  if ( hz > 0.0 ) uvC.x += sin( w.z * 9.0 - uTime * 5.5 + sin( w.x * 0.9 + uTime * 1.3 ) * 1.6 ) * hz * uTexel.x * uPx;
  vec4 col = texture2D( tColor, uvC );
  vec3 na = a.xyz * 2.0 - 1.0;
  float e = 0.0;
  if ( aa > 0.002 && rd < 1.0 ) {
    for ( int i = 0; i < 8; i ++ ) {
      vec2 uv = vUv + OFF[ i ] * uTexel * uPx;
      float db = lin( texture2D( tDepth, uv ).x );
      vec4 b = texture2D( tNrm, uv );

// Height at which a point at depth z appears at a given vertical screen position (NDC).
function yForNdc(z, ndc) {

  const cy = camTy + camDist * Math.sin(th), cz = CAM.tz + camDist * Math.cos(th);

}
function buildClouds() {

  const r = rng(7);
  const specs = [[-10, -46, 0.55, 1.2], [6, -70, 0.86, 1.4], [26, -62, 0.93, 1.0], [46, -74, 0.9, 1.4], [66, -62, 0.92, 1.0], [86, -48, 0.55, 1.25], [-14, -26, -0.45, 1.0], [88, -28, -0.4, 1.1]];

    const n = 7 + Math.floor(r() * 4);
    for (let i = 0; i < n; i++) {
      const a = (i / (n - 1)) * PI - PI / 2 + span(r, -0.15, 0.15);

  grp.userData.relayout = () => { for (const m of grp.children) m.position.y = yForNdc(m.userData.z, m.userData.ndc); };

}

}

function buildBuilding() {

    // arcade: columns, beam, ceiling; fans, CCTV and conduits
    bounds.forEach((x, i) => {
      const cx = i === 0 ? x + 0.25 : i === bounds.length - 1 ? x - 0.25 : x;
      const reel = [27, 51.5].includes(x);
      arcadeColumn(g, ic, cx, { lamp: true, conduit: i % 2 === 1, alarm: i % 3 === 1 && !reel, extinguisher: i % 3 === 2 && !reel });
      if (i % 2 === 0 && i > 0 && i < bounds.length - 1) wallFan(g, cx + 0.27, 3.5, L.z.col - 0.1, 0.9);

    // drip mould under the beam, a cornice on top, a cable conduit with junction boxes along the face
    rboxMM(g, M.trim, a, b, L.y.beamBot - 0.05, L.y.beamBot + 0.04, L.z.col - 0.3, L.z.beam + 0.035, 0.012);
    rboxMM(g, M.trim, a, b, L.y.ceil - 0.07, L.y.ceil + 0.03, L.z.col - 0.3, L.z.beam + 0.05, 0.012);
    rod(g, M.pipe, 0.018, V3(a + 0.3, L.y.beamBot + 0.08, L.z.beam + 0.05), V3(b - 0.3, L.y.beamBot + 0.08, L.z.beam + 0.05));
    for (const x of bounds.slice(1, -1)) rboxMM(g, M.white, x - 0.07, x + 0.07, L.y.beamBot + 0.03, L.y.beamBot + 0.15, L.z.beam + 0.03, L.z.beam + 0.09, 0.012);
    boxMM(g, M.ceiling, a, b, L.y.ceil, S, L.z.rear, L.z.beam);
    for (const s of bays) shopShell(g, Math.max(s.x0, a), Math.min(s.x1, b));
    bounds.forEach((x, i) => {
      const t = i === 0 || i === bounds.length - 1 ? 0.24 : 0.12;

      boxMM(g, M.partition, xa, xb, L.y.walk, L.y.ceil, L.z.rear, L.z.shop);
    });
    // upper floors (complete block, three storeys of flats over the shops)
    for (let k = 0; k < L.y.floors; k++) {
      const y0 = S + k * F;
      rboxMM(g, M.trim, a, b, y0 - 0.25, y0 + 0.06, L.z.wall - 0.02, L.z.beam + 0.04, 0.02);
    }
    for (const [bi, s] of bays.entries()) {

      boxMM(g, wall, x0, x1, roofY - 0.25, roofY, L.z.rear, L.z.wall);

      for (let k = 0; k < L.y.floors; k++) {

    }, { rz: i % 2 ? 0.04 : -0.03 });

  for (const x of [27, 51.5]) {

  bakeChunks(g, 12);
}

function rainTree(g, ic, x, z) {
  const bark = toon(0x8a7764);
  const base = V3(x, L.y.walk, z), fork = V3(x + 0.05, 2.3, z + 0.25);
  rod(g, bark, 0.3, base, fork, { rt: 0.72, seg: 12 });
  ball(g, bark, 0.36, x, L.y.walk + 0.1, z, { sy: 0.4 });
  ball(g, bark, 0.24, fork.x, fork.y, fork.z);
  const r = rng(41), C = V3(x - 0.05, 6.0, z + 1.35);
  // umbrella crown: a broad dome, a ring of lobes, and smaller lobes drooping at the rim
  const lobes = [[C.x, C.y + 0.4, C.z, 2.2, 1.0, 1.8]];
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * TAU + span(r, -0.2, 0.2), d = span(r, 2.2, 2.6);
    lobes.push([C.x + Math.cos(a) * d * 1.12, C.y - 0.05 + span(r, -0.2, 0.15), C.z + Math.sin(a) * d * 0.8, span(r, 1.3, 1.65), span(r, 0.8, 0.98), span(r, 1.15, 1.4)]);
  }
  for (let k = 0; k < 4; k++) {
    const a = k / 4 * TAU + 0.8 + span(r, -0.3, 0.3), d = span(r, 0.8, 1.3);
    lobes.push([C.x + Math.cos(a) * d * 1.1, C.y + 1.05 + span(r, -0.1, 0.15), C.z + Math.sin(a) * d * 0.8, span(r, 0.85, 1.15), span(r, 0.5, 0.65), span(r, 0.75, 1.0)]);
  }
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * TAU + 0.4 + span(r, -0.2, 0.2), d = span(r, 3.2, 3.5);
    lobes.push([C.x + Math.cos(a) * d * 1.08, C.y - 0.5 + span(r, -0.15, 0.1), C.z + Math.sin(a) * d * 0.78, span(r, 0.85, 1.1), span(r, 0.58, 0.72), span(r, 0.8, 0.95)]);
  }
  // limbs from the fork into each lobe of the ring; they show under the umbrella
  for (const lb of lobes.slice(1, 9)) {
    const tip = V3(lb[0], lb[1] - 0.25, lb[2]).lerp(C, 0.25);
    const mid = fork.clone().lerp(tip, 0.45).add(V3(0, 0.55, 0));
    rod(g, bark, 0.14, fork, mid, { rt: 0.72, seg: 9 });
    ball(g, bark, 0.1, mid.x, mid.y, mid.z);
    rod(g, bark, 0.1, mid, tip, { rt: 0.5, seg: 8 });
  }
  // leaves in three sectors that sway on their own
  const groups = [0, 1, 2].map((i) => { const lb = new THREE.Group(); lb.position.copy(fork); lb.userData.dynamic = true; lb.userData.ph = i * 2.1; g.add(lb); return lb; });
  const items = [[], [], []];
  const sector = (p) => Math.min(2, Math.floor(((Math.atan2(p[2] - C.z, p[0] - C.x) + PI) / TAU) * 3));
  leafCrown((type, it) => { const si = sector(it.p); it.p = [it.p[0] - fork.x, it.p[1] - fork.y, it.p[2] - fork.z]; items[si].push(it); }, lobes, r, { len: 0.42, palette: PAL.crown, cover: 1.5, droop: 0.3, back: 0.45 });
  groups.forEach((lb, i) => instances(lb, leafCard('ovate'), items[i], IDEF.leaf));
  onTick((t) => {
    for (const lb of groups) {
      const ph = lb.userData.ph;
      lb.rotation.z = 0.012 * Math.sin(t * 0.9 + ph) + 0.006 * Math.sin(t * 2.3 + ph);
      lb.rotation.x = 0.01 * Math.sin(t * 0.7 + ph * 1.3);
    }
  });
  const ground = toFloor(C, 0);
  U.uDapple.value[0].set(ground.x, ground.z, 3.8, 0.6);
  // now and then a leaf drifts down, lands and fades
  const leaves = [];
  for (let i = 0; i < 5; i++) {
    const mat = foliageMat().clone();
    mat.onBeforeCompile = patchToon; mat.transparent = true; mat.color.set(pick(r, [0x9cc070, 0xc9c25a, 0xd9a85a]));
    const m = new THREE.Mesh(leafCard('ovate'), mat);
    m.scale.setScalar(0.22);
    m.visible = false; m.castShadow = false; m.userData.dynamic = true;
    g.add(m); leaves.push({ m, t: -span(r, 0, 8) });
  }
  onTick((t, dt) => {
    for (const lf of leaves) {
      lf.t += dt;
      if (lf.t < 0) continue;
      if (!lf.m.visible) {
        const a = Math.random() * TAU, d = Math.random() * 3.2;
        lf.p0 = V3(C.x + Math.cos(a) * d, 5.0, C.z + Math.sin(a) * d * 0.8);
        lf.ph = Math.random() * TAU; lf.m.visible = true; lf.t = 0; lf.m.material.opacity = 1;
      }
      const fall = Math.min(lf.t * 0.75, lf.p0.y - L.y.walk - 0.02);
      const landed = fall >= lf.p0.y - L.y.walk - 0.02;
      const sway = landed ? 0 : 1;
      lf.m.position.set(lf.p0.x + Math.sin(lf.t * 1.9 + lf.ph) * 0.45 * sway + lf.t * 0.12, lf.p0.y - fall, lf.p0.z + Math.cos(lf.t * 1.3 + lf.ph) * 0.2 * sway);
      lf.m.rotation.set(landed ? -PI / 2 : Math.sin(lf.t * 3 + lf.ph) * 1.2, lf.t * 1.5, landed ? 0 : Math.cos(lf.t * 2.4) * 0.8);
      if (landed) {
        const k = (lf.t - (lf.p0.y - L.y.walk) / 0.75) / 3;
        lf.m.material.opacity = clamp(1 - k, 0, 1);
        if (k > 1) { lf.m.visible = false; lf.t = -span(Math.random, 3, 9); }
      }
    }
  });
}

   grows it into a speech bubble about pasar malams and this website, and
   lights up what it points at with the gate's own highlight (rim of
   light, warm wash, amber lines, one sweep), drawn by the ink pass. Only
   one thing is lit at a time, so the gate's uniforms are shared.
   Shop and stall names in the scene are fictional; the bubbles explain
   the practices they illustrate.
   --------------------------------------------------------------------- */
const HOTSPOTS = [
  { id: 'about', groups: [], at: [11.6, 3.15, 0.2], kicker: 'About this website', title: 'Beyond the yellow lines',
    text: 'How do <em>pasar malams</em> (night markets) and the shops beside them bring HDB neighbourhoods to life, often beyond what was planned? Drag or scroll along this street: it turns from an ordinary afternoon into a pasar malam day. The street and its shops are illustrations, not a real place.' },
  { id: 'fruit', groups: ['fruit'], at: [18.6, 2.35, -0.7], kicker: 'What is an ODA?', title: 'Outdoor Display Areas',
    text: 'Many HDB shops sell from the space in front of their doors too: an <em>Outdoor Display Area</em>, or ODA, usually marked by a yellow line on the floor. This fruit seller’s durians have crept into half of the barber’s space next door.' },
  { id: 'provision', groups: ['provision'], at: [30.0, 2.45, -1.1], kicker: 'Planned vs lived', title: 'The line on the floor',
    text: 'The provision shop keeps every item inside its yellow line. The line is the plan; how shops actually use the space is the lived reality. The gap between the two is what this website maps.' },
  { id: 'boba', groups: ['boba'], at: [42.3, 2.3, -0.6], kicker: 'Sharing space', title: 'Two businesses, one ODA',
    text: 'The clothes rack isn’t the bubble tea shop’s: storage boxes split this display area between two businesses. Town Councils limit subletting, but informal deals like this may be one reason these spaces stay busy. It’s one of the practices our project looks into.' },
  { id: 'closure', groups: ['closure'], at: [45.1, 1.35, 5.3], kicker: 'What is a pasar malam?', title: 'The night market arrives',
    text: '<em>Pasar malam</em> is Malay for “night market”. Organisers take a temporary lease on a site in a housing estate, here a closed road beside the shops, often before festive seasons. Our 2026 sample contains 120 announced market episodes.' },
  { id: 'hardware', groups: ['hardware'], at: [47.7, 2.15, 0.9], kicker: 'Past the yellow line', title: 'Spilling onto the road',
    text: 'The market’s stalls compete with local shops for the same crowd. This hardware shop’s goods now run past its yellow line, over the drain and onto the closed road. Does a pasar malam push shops beyond their lines? That’s one of the questions we’re asking.' },
  { id: 'stalls', groups: ['stalls'], at: [54.2, 1.85, 5.5], kicker: 'The vendors', title: 'Small businesses on the move',
    text: 'Bags, batik, plants, snacks, drinks and toys: each stall is a small business, and many stallholders aren’t from this neighbourhood. Some brands turn up at market after market across the island. The brand map connects these appearances; the full map shows the markets in our 2026 research sample.' },
  { id: 'kueh', groups: ['kueh', 'medical'], at: [57.4, 2.05, -0.4], kicker: 'Old shops, new crowd', title: 'The neighbours join in',
    text: 'Behind the stalls, the kueh shop wheels its glass cabinet onto the road and the medical hall sets out sacks of dried goods. A pasar malam brings crowds that the shops around it serve too. Continue to Campbell Lane using the arrow on the right.' },
];
const HL = { cur: null, hot: 0, target: 0, enterT: -99, all: false, layer: null, closeTimer: 0 };
function litByHotspot(o) {
  const id = o.userData.hl;
  return id !== undefined && HL.hot > 0.001 && (HL.all || id === HL.cur?.id);
}
const _hp = V3();
function setupHotspots() {
  const layer = HL.layer = document.getElementById('hotspots');
  HOTSPOTS.forEach((h, i) => {
    h.p = V3(...h.at); h.box = new THREE.Box3(); h.leaveT = -99; h.on = true;
    for (const gid of h.groups) {
      const g = SECTION_GROUPS[gid];
      if (!g) continue;
      g.traverse((o) => { if (o.isMesh && !o.userData.gate) o.userData.hl = h.id; });
      h.box.expandByObject(g);
    }
    const el = h.el = document.createElement('div');
    el.className = 'hs';
    el.innerHTML = `<button type="button" class="hs-dot" aria-expanded="false" aria-describedby="hs-${h.id}" style="--delay:${(i * 0.4).toFixed(1)}s">` +
      `<span class="hs-sr">${h.title}</span></button><div class="hs-bubble" id="hs-${h.id}" role="tooltip">` +
      `<span class="hs-title">${h.title}</span><p>${h.text}</p></div>`;
    const dot = el.firstElementChild;
    dot.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') openHotspot(h); });
    el.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') closeHotspot(h, 160); });
    el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && HL.cur === h) clearTimeout(HL.closeTimer); });
    // a mouse click keeps an open bubble open; a second tap closes it (the first tap's focus has just opened it)
    let kind = 'mouse';
    dot.addEventListener('pointerdown', (e) => { kind = e.pointerType; });
    dot.addEventListener('click', () => {
      const open = HL.cur === h && h.el.classList.contains('open');
      if (open && kind !== 'mouse' && performance.now() - h.openedAt > 350) closeHotspot(h); else openHotspot(h);
    });
    dot.addEventListener('focus', () => {
      // keyboard: bring the dot's part of the street into view, then open it
      if (!h.on) pan.goal = clamp(h.p.x, pan.min, pan.max), pan.idle = 0;
      openHotspot(h);
    });
    dot.addEventListener('blur', () => closeHotspot(h, 120));
    layer.appendChild(el);
  });
  // the street keeps scrolling with the wheel while the pointer is over a dot or a bubble
  layer.addEventListener('wheel', (e) => { e.preventDefault(); renderer.domElement.dispatchEvent(new WheelEvent('wheel', e)); }, { passive: false });
  // a tap on the street, or Escape, closes an open bubble
  renderer.domElement.addEventListener('pointerdown', () => { if (HL.cur) closeHotspot(HL.cur); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && HL.cur) closeHotspot(HL.cur); });
}
function openHotspot(h) {
  clearTimeout(HL.closeTimer);
  if (FLY.on) return;
  if (HL.cur && HL.cur !== h) {
    HL.cur.el.classList.remove('open'); HL.cur.el.firstElementChild.setAttribute('aria-expanded', 'false');
    HL.cur.leaveT = GATE.t; HL.hot = 0;          // switch the light straight over to the new target
  }
  if (HL.cur !== h || !HL.target) { if (GATE.t - h.leaveT > 0.3) HL.enterT = GATE.t; }
  if (!h.el.classList.contains('open')) h.openedAt = performance.now();
  HL.cur = h; HL.target = h.groups.length ? 1 : 0;
  placeBubble(h);
  h.el.classList.add('open'); h.el.firstElementChild.setAttribute('aria-expanded', 'true');
}
function closeHotspot(h, delay = 0) {
  clearTimeout(HL.closeTimer);
  const go = () => {
    if (HL.cur !== h) return;
    h.el.classList.remove('open'); h.el.firstElementChild.setAttribute('aria-expanded', 'false');
    HL.target = 0; h.leaveT = GATE.t;
  };
  if (delay) HL.closeTimer = setTimeout(go, delay); else go();
}
// Keep the bubble on screen: above the dot when there is room, below it otherwise, and slid sideways at the edges
// while its tail keeps pointing at the dot.
function placeBubble(h) {
  const w = innerWidth, bw = Math.min(300, w - 24), pad = 12;
  const bubble = h.el.lastElementChild, height = bubble.offsetHeight || 190;
  const below = h.y - height - 34 < pad && h.y + height + 34 < innerHeight;
  const bx = clamp(0, pad + bw / 2 - h.x, w - pad - bw / 2 - h.x);
  h.el.classList.toggle('below', below);
  h.el.style.setProperty('--bw', bw + 'px');
  h.el.style.setProperty('--bx', bx.toFixed(1) + 'px');
}
// the screen rect and near depth of what the open dot lights up, in the gate's uniforms
function hotspotScreenBox(b) {
  const u = INK.uniforms;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0, near = Infinity;
  for (let i = 0; i < 8; i++) {
    _gp.set(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z);
    near = Math.min(near, -_gv.copy(_gp).applyMatrix4(camera.matrixWorldInverse).z);
    _gp.project(camera);
    x0 = Math.min(x0, _gp.x * 0.5 + 0.5); x1 = Math.max(x1, _gp.x * 0.5 + 0.5);
    y0 = Math.min(y0, _gp.y * 0.5 + 0.5); y1 = Math.max(y1, _gp.y * 0.5 + 0.5);
  }
  u.uGateBox.value.set(x0, y0, x1, y1);
  u.uGateNear.value = near - 0.4;
}
function updateHotspots(t, dt) {
  if (!HL.layer) return;
  HL.layer.classList.toggle('flying', FLY.on);
  const w = innerWidth, h = innerHeight;
  for (const s of HOTSPOTS) {
    _hp.copy(s.p).project(camera);
    s.x = (_hp.x * 0.5 + 0.5) * w; s.y = (-_hp.y * 0.5 + 0.5) * h;
    const on = !FLY.on && _hp.z < 1 && s.x > 8 && s.x < w - 8 && s.y > 8 && s.y < h - 8;
    s.el.style.transform = `translate3d(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px, 0)`;
    if (on !== s.on) { s.on = on; s.el.classList.toggle('off', !on); if (!on && HL.cur === s) closeHotspot(s); }
  }
  if (HL.cur && HL.cur.el.classList.contains('open')) placeBubble(HL.cur);
  // the same easing as the gate's light
  HL.hot += (HL.target - HL.hot) * (1 - Math.exp(-dt / (HL.target > HL.hot ? 0.055 : 0.09)));
  if (Math.abs(HL.target - HL.hot) < 0.002) HL.hot = HL.target;
  if (HL.cur && HL.hot > 0.001 && HL.hot >= GATE.hot) {
    const u = INK.uniforms, te = t - HL.enterT;
    u.uGate.value = HL.hot;
    hotspotScreenBox(HL.cur.box);
    u.uSweep.value = !REDUCED.matches && te >= 0 && te < 0.7 ? -0.35 + 1.75 * easeInOutSine(clamp(te / 0.62, 0, 1)) : -1;
  }
}

/* ---------------------------------------------------------------------
   16. Sun shadow frustum that follows the camera (texel-snapped) and a
   small pool of point lights reassigned to the nearest light anchors.
   --------------------------------------------------------------------- */
const SH = { cx: null, basis: null, texel: [0, 0], dist: 80 };
function setupShadowFrustum() {
  // Orient the shadow camera so its x axis follows the street; the map then fits the long strip.
  const xD = V3(1, 0, 0).sub(SUN_DIR.clone().multiplyScalar(SUN_DIR.x)).normalize();
  const yD = new THREE.Vector3().crossVectors(SUN_DIR, xD).normalize();
  sun.shadow.camera.up.copy(yD);
  const xA = V3(), yA = V3(), zA = V3();
  new THREE.Matrix4().lookAt(SUN_DIR, V3(0, 0, 0), yD).extractBasis(xA, yA, zA);
  SH.basis = [xA, yA, zA];
  const half = viewWidth() / 2 + 8;
  const top = L.y.slab + L.y.floors * L.y.floorH + 2.6;      // roof, parapet and water tanks
  let l = Infinity, r = -Infinity, b = Infinity, t = -Infinity, n = Infinity, f = -Infinity;
  for (const x of [-half, half]) for (const y of [L.y.base, top]) for (const z of [L.z.edge - 1, L.z.front + 1]) {
    const p = V3(x, y, z);
    const px = p.dot(xA), py = p.dot(yA), pz = p.dot(zA);
    l = Math.min(l, px); r = Math.max(r, px); b = Math.min(b, py); t = Math.max(t, py); n = Math.min(n, pz); f = Math.max(f, pz);
  }
  const maxTex = renderer.capabilities.maxTextureSize;
  const w = Math.min(4096, maxTex);
  const h = Math.min(w, Math.ceil(w * (t - b) / (r - l) / 64) * 64);
  sun.shadow.mapSize.set(w, h);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  const cam = sun.shadow.camera;
  cam.left = l; cam.right = r; cam.bottom = b; cam.top = t;
  cam.near = SH.dist - f - 2; cam.far = SH.dist - n + 2;
  cam.updateProjectionMatrix();
  SH.texel = [(r - l) / w, (t - b) / h];
  SH.cx = null;
}
function updateShadow(x) {
  if (SH.cx !== null && Math.abs(x - SH.cx) < 4) return;
  SH.cx = x;
  const [xA, yA, zA] = SH.basis;
  const p = V3(x, 0, 0);
  const a = Math.round(p.dot(xA) / SH.texel[0]) * SH.texel[0], b = Math.round(p.dot(yA) / SH.texel[1]) * SH.texel[1], c = p.dot(zA);
  const T = xA.clone().multiplyScalar(a).addScaledVector(yA, b).addScaledVector(zA, c);
  sun.target.position.copy(T);
  sun.position.copy(T).addScaledVector(SUN_DIR, SH.dist);
  sun.target.updateMatrixWorld(); sun.updateMatrixWorld();
  sun.shadow.needsUpdate = true;
}
function setupLightPool(n = 6) {
  for (let i = 0; i < n; i++) { const p = new THREE.PointLight(0xffd29a, 0, 7, 1.5); scene.add(p); POOL.push(p); }
}
function updateLightPool(cx) {
  const half = viewWidth() / 2 + 3;
  const near = LIGHT_ANCHORS.map((a) => [Math.abs(a.pos.x - cx), a]).sort((p, q) => p[0] - q[0]);
  POOL.forEach((pl, i) => {
    const s = near[i];
    if (!s) { pl.intensity = 0; return; }
    const [d, a] = s;
    pl.position.copy(a.pos); pl.color.copy(a.color); pl.distance = a.distance;
    pl.intensity = a.intensity * (1 - smoothstep(d, half - 2, half + 4));
  });
}

/* ---------------------------------------------------------------------
   17. Boot
   --------------------------------------------------------------------- */
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  frameCamera(); sizePipeline(); panBounds(); setupShadowFrustum();
  SECTION_GROUPS.clouds?.userData.relayout?.();
  pan.x = clamp(pan.x, pan.min, pan.max); pan.goal = pan.x;
}
const STATS = { frames: 0, ms: [] };
window.__stats = STATS;
// Step the pixel ratio down if this machine cannot hold ~45 fps (invisible to the viewer).
const QUALITY = { acc: 0, n: 0, done: false };
function adaptQuality(dt) {
  if (QUALITY.done || STATS.frames < 30) return;
  QUALITY.acc += dt; QUALITY.n++;
  if (QUALITY.n < 90) return;
  const avg = QUALITY.acc / QUALITY.n;
  QUALITY.acc = 0; QUALITY.n = 0;
  if (avg > 0.022 && PR > 1) {
    PR = Math.max(1, PR > 1.5 ? 1.5 : 1);
    renderer.setPixelRatio(PR);
    composer.setPixelRatio(PR);
    sizePipeline();
  } else QUALITY.done = true;
}
async function main() {
  frameCamera(); panBounds();
  makeShared();
  fruitTextures();
  buildClouds();
  buildBase();
  buildStreet();
  buildBuilding();
  for (const s of SECTIONS) {
    s.group = newGroup(s.id);
    if (s.build) s.build(s);
    else if (s.shop) buildShutteredBay(s);
  }
  buildClosure();
  buildTent();
  buildStalls();
  placeAnimals();
  SECTIONS.filter((s) => s.shop).forEach((s, i) => {
    U.uShopBox.value[i].set(s.x0, s.x1, 0, 0);
    if (s.build && s.light) U.uShopCol.value[i].set(s.light[0]).multiplyScalar(s.light[1]);
  });
  setupLightPool(6);
  buildComposer();
  setupShadowFrustum();
  bindControls();
  bindGate();
  setupHotspots();
  // ?x= is for development; #x= is left by the gate on the way out, so the back button returns to it
  const qx = parseFloat(new URLSearchParams(location.search).get('x') ?? new URLSearchParams(location.hash.slice(1)).get('x'));
  pan.x = pan.goal = Number.isFinite(qx) ? clamp(qx, pan.min, pan.max) : pan.min;
  placeCamera(pan.x); updateShadow(pan.x); updateLightPool(pan.x);

  await loadFonts();
  CANVASES.forEach(repaint);
  if (document.fonts) document.fonts.addEventListener?.('loadingdone', () => CANVASES.forEach(repaint));
  try { await renderer.compileAsync(scene, camera); } catch (e) { /* compile lazily */ }
  // compile the lit gate's shaders and the twinkle now, while the canvas is still hidden, so the first hover doesn't stall
  GATE.hot = INK.uniforms.uGate.value = 1; GATE.star.visible = true;
  composer.render(0);
  GATE.hot = INK.uniforms.uGate.value = 0; GATE.star.visible = false;
  // the same for everything the story dots light up
  HL.all = true; HL.hot = 1; composer.render(0); HL.all = false; HL.hot = 0;

  const clock = new THREE.Clock();
  let shown = 0;
  renderer.info.autoReset = false;
  renderer.setAnimationLoop(() => {
    renderer.info.reset();
    const dt = Math.min(clock.getDelta(), 1 / 20), t = clock.elapsedTime;
    if (FLY.on) updateFly(t, dt); else { updatePan(dt); placeCamera(pan.x); }
    camera.updateMatrixWorld();
    updateGate(t, dt);
    updateHotspots(t, dt);
    updateShadow(pan.x);
    updateLightPool(pan.x);
    U.uTime.value = t;
    sun.intensity = SUN_K * (1 - 0.05 * smoothstep(Math.sin(t * 0.11) + Math.sin(t * 0.047 + 1.3), 0.9, 1.8));
    for (const f of TICKS) f(t, dt);
    updatePuffs(dt);
    composer.render(dt);
    if (++shown === 3) { renderer.domElement.classList.add('ready'); HL.layer.classList.add('ready'); }
    adaptQuality(dt);
    STATS.frames++; STATS.ms.push(dt * 1000); if (STATS.ms.length > 240) STATS.ms.shift();
    STATS.calls = renderer.info.render.calls; STATS.tris = renderer.info.render.triangles;
    STATS.x = pan.x; STATS.min = pan.min; STATS.max = pan.max;
  });
}
main();
</script>
