<script type="module">
import {mountFeedback} from './app.js';
import {FEEDBACK_CONNECTION} from '../feedback-connection.js';
const config={mapboxToken:window.MAPBOX_CONFIG?.accessToken};
mountFeedback(document.querySelector('#feedback'),{...config,...FEEDBACK_CONNECTION}).catch(error=>{
 const p=document.createElement('p');p.className='fb-loading';p.textContent='The feedback map could not open. '+error.message;document.querySelector('#feedback').replaceChildren(p);
