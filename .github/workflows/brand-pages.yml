name: Publish brand atlas and preserve original website
on:
  push:
    branches: [main]
    paths:
      - 'brand-connections/**'
      - 'scripts/prepare_brand_publication.py'
      - '.github/workflows/brand-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare reviewed publication without committing runtime data
        env:
          BRAND_DISPLAY_POINTS_GZIP: ${{ vars.BRAND_DISPLAY_POINTS_GZIP }}
        run: python scripts/prepare_brand_publication.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: __brand_publish
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
